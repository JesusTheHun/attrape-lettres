<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Attrape-Lettres">
  <!--
    The favicon — a hand-kept transcription of the app icon, whose SOURCE is
    apps/game-ios/Sources/ALUI/AppIcon/AppIcon.swift and whose authority is the
    PNGs beside this file (`swift run IconForge` writes all of them).

    An SVG cannot come out of that renderer, so this one is typed. It is the
    only icon here that can drift; keep the numbers below in step with
    `CoralIcon` if the mark ever changes. Everything is in the same 1024-unit
    space, so they transcribe one for one.

    Rendered at 16 px in a browser tab, which is why there is no soft shadow
    under the tile: at that size it is one grey pixel.
  -->
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF8A65"/>
      <stop offset="1" stop-color="#E8722C"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#field)"/>

  <!-- IconFleck(1) 62×62 @ (-352,-300) rot 18 -->
  <g transform="translate(160 212) rotate(18)">
    <rect x="-31" y="-31" width="62" height="62" rx="21" fill="#FFD54F"/>
  </g>
  <!-- IconFleck(2) 48×104 @ (350,-240) rot -24 -->
  <g transform="translate(862 272) rotate(-24)">
    <rect x="-24" y="-52" width="48" height="104" rx="16" fill="#4FC3F7"/>
  </g>

  <!-- IconTile(cream, "A", side 560) rot -7. rx = 560 × 28/92. -->
  <g transform="translate(512 512) rotate(-7)">
    <rect x="-280" y="-280" width="560" height="560" rx="170.4" fill="#FFF6EE"/>
    <text x="0" y="0" text-anchor="middle" dominant-baseline="central"
          font-family="ui-rounded,'SF Pro Rounded',system-ui,sans-serif"
          font-weight="900" font-size="347" fill="#4A2317">A</text>
  </g>
</svg>
